openapi: 3.0.0
info:
  title: MyProject API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
paths:
  /table-data:
    get:
      operationId: getTableData
      summary: Получить таблицу
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
    delete:
      operationId: clearTableData
      summary: Очистить таблицу
      responses:
        '200':
          description: Таблица очищена
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
  /table-data/cell:
    patch:
      operationId: updateTableCell
      summary: Обновить одну ячейку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                row:
                  type: integer
                col:
                  type: integer
                value:
                  type: string
      responses:
        '200':
          description: Ячейка обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /news:
    get:
      summary: Получить новости
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /achievements:
    get:
      summary: Получить достижения
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /support:
    get:
      summary: Получить поддержку
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
